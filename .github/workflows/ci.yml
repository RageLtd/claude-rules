name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate plugin.json
        run: jq . .claude-plugin/plugin.json > /dev/null

      - name: Check rule files exist
        run: |
          COUNT=$(find rules -name '*.md' -type f | wc -l)
          echo "Found $COUNT rule files"
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No rule files found in rules/"
            exit 1
          fi

      - name: Check every .enforce.toml has its paired body
        run: |
          STATUS=0
          for toml in $(find rules -name '*.enforce.toml'); do
            BODY=$(grep -oE '^body = "\./[^"]+"' "$toml" | sed 's/.*"\.\///; s/"$//') || true
            if [ -n "$BODY" ] && [ ! -f "$(dirname "$toml")/$BODY" ]; then
              echo "ERROR: $toml references missing body $BODY"
              STATUS=1
            fi
          done
          exit $STATUS

      - name: Test
        run: bun test

  # The emitted checker is plain Node and has to survive a Windows checkout,
  # where core.autocrlf rewrites every .md on the way to disk. This job is the
  # regression test for the LF normalisation in the digest.
  vendor-windows:
    name: Vendor round-trip (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # bash, not pwsh: GitHub's pwsh shell exits the step with $LASTEXITCODE,
      # so a step that deliberately runs a failing command inherits its code
      # and fails even when the assertion around it passed.
      - name: Sync into a scratch repo
        shell: bash
        run: |
          mkdir -p scratch
          bun bin/claude-rules sync --cwd scratch

      - name: Verify with the emitted Node checker
        shell: bash
        run: node scratch/.claude/rules-check.mjs

      - name: Verify tampering is still caught
        shell: bash
        run: |
          echo "tampered" >> scratch/.claude/rules/coding/testing.md
          if node scratch/.claude/rules-check.mjs; then
            echo "ERROR: checker passed on tampered content"
            exit 1
          fi
          echo "tampering correctly detected"

  version-preview:
    name: Version Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Preview Version Bump
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          OUTPUT=$(bun scripts/release.ts --dry-run 2>&1) || true
          echo "$OUTPUT"
          {
            echo "## Version Bump Preview"
            echo ""
            echo '```'
            echo "$OUTPUT"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
